<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Menu Immagini</title>
    <style>
        :root {
            --primary-color: #2A3F54;
            --secondary-color: #1ABB9C;
            --accent-color: #34495E;
            --light-bg: #F8F9FA;
            --text-dark: #2C3E50;
            --shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            --sidebar-width: 280px;
            --mobile-padding: 16px; /* Nuova variabile per padding mobile */
            --card-margin: 8px; /* Margine tra le card */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            background-color: var(--light-bg);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Stili aggiuntivi ottimizzati per mobile */
        .image-grid {
            width: calc(100% - 2 * var(--mobile-padding));
            padding: var(--mobile-padding);
            display: flex;
            flex-direction: column;
            gap: var(--card-margin);
            overflow-y: auto;
            box-sizing: border-box;
        }

        .image-card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            height: 300px;
            overflow: hidden;
            transition: transform 0.2s ease;
            display: flex;
            flex-direction: column;
            margin: 0 var(--card-margin); /* Distanza dai bordi laterali */
        }

        .image-container {
            flex: 1;
            overflow: hidden;
            padding: 0; /* Reset padding */
            margin: 0; /* Reset margin */
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block; /* Rimuove spazio sotto l'immagine */
        }

        .image-title {
            padding: 12px var(--mobile-padding);
            background-color: var(--primary-color);
            color: white;
            font-weight: 600;
            text-align: center;
            border-radius: 0 0 12px 12px;
            margin: 0; /* Rimuove margini default */
        }

        /* Ottimizzazione per schermi piccoli */
        @media (max-width: 480px) {
            :root {
                --mobile-padding: 12px;
                --card-margin: 6px;
            }
            
            .image-card {
                height: 260px; /* Altezza ridotta per mobile */
            }
            
            .image-title {
                padding: 10px var(--mobile-padding);
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="image-grid">
        <!-- Card 1 -->
        <div class="image-card">
            <div class="image-container">
                <img src="immagine1.jpg" alt="Opzione 1">
            </div>
            <div class="image-title">Centro commerciale</div>
        </div>
        
        <!-- Card 2 -->
        <div class="image-card">
            <div class="image-container">
                <img src="immagine2.jpg" alt="Opzione 2">
            </div>
            <div class="image-title">Scuola</div>
        </div>
        
        <!-- Card 3 -->
        <div class="image-card">
            <div class="image-container">
                <img src="immagine3.jpg" alt="Opzione 3">
            </div>
            <div class="image-title">Ospedale</div>
        </div>
        
        <!-- Card 4 -->
        <div class="image-card">
            <div class="image-container">
                <img src="immagine4.jpg" alt="Opzione 4">
            </div>
            <div class="image-title">Parco giochi</div>
        </div>
    </div>
</body>
</html>
